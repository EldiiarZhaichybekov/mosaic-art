<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DrawACRL — Result 3 lab</title>
<style>body{font:15px system-ui;background:#f1f5f9;color:#172033;margin:24px}header{display:flex;gap:12px;flex-wrap:wrap;align-items:center}button,select,input{padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:white}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}section{background:white;padding:12px;border-radius:12px}canvas{width:100%;height:auto}pre{white-space:pre-wrap;overflow:auto;max-height:380px}#status{padding:16px;background:white;border-left:5px solid #4338ca}h2{font-size:16px}</style>
<header><h1>Result 3 — experimental lab</h1><select id="language" aria-label="Language"><option value="ru">РУС</option><option value="en" selected>ENG</option><option value="zh">中文</option></select><input type="file" id="upload" accept="image/png,image/jpeg,image/webp"><select id="format" aria-label="Canvas"><option value="400,400">400 × 400 mm</option><option value="300,400">300 × 400 mm</option><option value="400,300">400 × 300 mm</option></select><button id="run" disabled></button><button id="svg" disabled>SVG</button><button id="jpg" disabled>JPG</button></header>
<p id="notice"></p><p id="status" role="status"></p><main><section><h2>Source</h2><canvas id="source"></canvas></section><section><h2>Result 2</h2><canvas id="optimized"></canvas></section><section><h2>Manufacturable target</h2><canvas id="target"></canvas></section><section><h2>Hybrid Result 3</h2><canvas id="final"></canvas></section><section><h2>Existing deterministic Result 3</h2><canvas id="baseline"></canvas></section></main><details><summary>Developer diagnostics: path IDs, plan, QA, repair, timings</summary><canvas id="path-map"></canvas><pre id="debug"></pre></details>
<script src="../tile-layout.js"></script><script src="../tile-i18n.js"></script><script src="../optimized-contour.js"></script><script src="../result3-hybrid.js"></script><script src="../result3-lab.js"></script></html>
