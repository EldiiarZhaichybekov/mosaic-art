<!doctype html><meta charset="utf-8"><title>DrawACRL — segment audit</title>
<style>body{margin:20px;font:14px system-ui;background:#eef1f6;color:#17243a}header{display:flex;gap:12px;flex-wrap:wrap;align-items:center}main{display:grid;grid-template-columns:minmax(400px,1fr) 360px;gap:15px;margin-top:15px}canvas{width:100%;background:white;border:1px solid #aaa}pre{white-space:pre-wrap;overflow:auto;max-height:85vh;background:white;padding:12px;font-size:11px}button,select,input{padding:7px} @media(max-width:800px){main{display:block}}</style>
<header><b>Segment audit — unchanged pipeline</b><select id="stage"></select><select id="mode"><option value="all">All candidate IDs</option><option value="none">Image only</option><option value="accepted">Accepted</option><option value="rejected">Rejected</option><option value="reason">Rejection reasons</option><option value="cluster">Connected clusters</option><option value="final">Survives final</option></select><label>ID <input id="sid" type="number" min="0" style="width:70px"></label><label><input id="ids" type="checkbox">Labels</label><button id="reset">Clear selection</button></header>
<p>Click a line to see exact scores and surviving pixels. Orange: length gate; red: score; purple: both. Cluster mode highlights the selected segment’s entire component. Full-resolution layers are separate from the actual compressed production preview.</p>
<main><div><canvas id="cv"></canvas></div><pre id="details"></pre></main>
<script>
const payload=/*AUDIT_DATA*/;
const {data,images}=payload,cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stage=document.getElementById('stage'),mode=document.getElementById('mode'),details=document.getElementById('details'),sid=document.getElementById('sid'),ids=document.getElementById('ids');
let selected=null;const loaded={};
for(const [k,url] of Object.entries(images)){const o=document.createElement('option');o.value=o.textContent=k;stage.append(o);const im=new Image();im.src=url;im.onload=draw;loaded[k]=im;}
stage.value='raw';[cv.width,cv.height]=data.summary.processed_size;
function draw(){ctx.clearRect(0,0,cv.width,cv.height);const im=loaded[stage.value];if(im?.complete)ctx.drawImage(im,0,0,cv.width,cv.height);for(const r of data.segments){if(mode.value==='none'&&r.id!==selected)continue;if(mode.value==='accepted'&&!r.accepted||mode.value==='rejected'&&r.accepted||mode.value==='final'&&r.final_fraction===0)continue;const cluster=selected!==null?data.segments[selected].candidate_component:null;let color=r.accepted?'#149660':'#c9313d';if(mode.value==='reason')color=r.accepted?'#149660':r.exact_rejections.length===2?'#8f26ca':r.exact_rejections[0].startsWith('length')?'#ed8a00':'#c9313d';if(mode.value==='cluster')color=`hsl(${r.candidate_component*137%360} 75% 40%)`;ctx.globalAlpha=selected===null?.6:r.id===selected||mode.value==='cluster'&&r.candidate_component===cluster?1:.08;ctx.strokeStyle=r.id===selected?'#006cff':color;ctx.lineWidth=r.id===selected?3:1;ctx.beginPath();r.path.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();if((ids.checked&&r.length>15)||r.id===selected){ctx.fillStyle=color;ctx.font='10px monospace';ctx.fillText(r.id,...r.start);}}ctx.globalAlpha=1;details.textContent=JSON.stringify(selected===null?data.summary:{...data.segments[selected],path:undefined,cluster:data.clusters.find(c=>c.id===data.segments[selected].candidate_component),near:data.near.filter(n=>n.a===selected||n.b===selected)},null,2);}
cv.onclick=e=>{const rect=cv.getBoundingClientRect(),x=(e.clientX-rect.left)*cv.width/rect.width,y=(e.clientY-rect.top)*cv.height/rect.height;let best=100,id=null;for(const r of data.segments)for(const p of r.path){const d=(p[0]-x)**2+(p[1]-y)**2;if(d<best){best=d;id=r.id;}}selected=id;sid.value=id??'';draw();};
sid.onchange=()=>{selected=data.segments[+sid.value]?+sid.value:null;draw()};stage.onchange=mode.onchange=ids.onchange=draw;document.getElementById('reset').onclick=()=>{selected=null;draw()};
</script>
