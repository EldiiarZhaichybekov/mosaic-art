<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DrawACRL</title>
<style>body{font:15px system-ui;margin:24px;background:#f1f5f9;color:#172033}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap}select{padding:10px}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}section{background:white;padding:16px;border-radius:12px}svg{width:100%;height:auto}h2{font-size:16px}@media(max-width:700px){main{grid-template-columns:1fr}}</style>
<header><h1 id="heading"></h1><select id="language"><option value="ru">РУС</option><option value="en">ENG</option><option value="zh">中文</option></select><select id="fixture"></select></header><p id="stats"></p><main><section><h2 id="left-title"></h2><div id="left"></div></section><section><h2 id="right-title"></h2><div id="right"></div></section></main>
<script src="../tile-layout.js"></script><script src="../tile-i18n.js"></script><script src="../optimized-contour.js"></script><script>
'use strict';let cases={},language='ru';const $=id=>document.getElementById(id),t=k=>TileMessages[language][k];
function render(){const key=$('fixture').value,source=cases[key];$('heading').textContent=t('opt.experiments');$('left-title').textContent=t('opt.input');$('right-title').textContent=t('tile.result2')+' — '+t('opt.name');$('language').setAttribute('aria-label',t('opt.language'));$('fixture').setAttribute('aria-label',t('opt.fixture'));for(const option of $('fixture').options)option.textContent=t('opt.case.'+option.value);if(!source)return;const result=OptimizedContour.generate(source);$('left').innerHTML=OptimizedContour.exportSVG({status:'ok',canvas:[400,400],paths:[source.contour,...source.internal_lines].map(points=>({points}))});$('right').innerHTML=OptimizedContour.exportSVG(result);$('stats').textContent=`${source.internal_lines.length} → ${result.internal_lines.length} · ${result.timings.totalMs} ${language==='zh'?'毫秒':language==='ru'?'мс':'ms'}`;}
$('language').onchange=()=>{language=$('language').value;render();};$('fixture').onchange=render;
fetch('fixtures/optimized-cases.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json();}).then(data=>{cases=data;for(const key of Object.keys(cases)){const option=document.createElement('option');option.value=key;$('fixture').append(option);}render();}).catch(error=>{$('stats').textContent=t('opt.failure');console.error(error);});
</script></html>
